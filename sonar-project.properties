sonar.projectKey=codex-discord-presence
sonar.projectName=Codex Discord Presence
sonar.sourceEncoding=UTF-8

# 來源：外掛 scripts（含 shared 子目錄）
sonar.sources=plugins

# 測試：Node 內建 test runner 的測試檔
sonar.tests=tests

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=tests/**,**/*.test.js

# 產物、執行時資料、VCS、scanner 工作目錄與二進位資產
sonar.exclusions=**/*.log,**/*.state.json,**/*.diagnostic.json,**/*.start.lock,\
  **/.scannerwork/**,**/.git/**,**/.omc/**,**/node_modules/**,coverage/**,\
  **/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.pdf,**/*.zip